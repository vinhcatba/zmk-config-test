<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="Trackball Keymap Layout">
  <defs>
    <radialGradient id="ballGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="30%" stop-color="#7fa1c3"/>
      <stop offset="75%" stop-color="#476685"/>
      <stop offset="100%" stop-color="#273a4f"/>
    </radialGradient>
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7ebd0"/>
      <stop offset="100%" stop-color="#7bc7a6"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 14; }
      .layer-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .layer-sub { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #64748b; }
      .case-body { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .case-bevel { fill: url(#bevelGrad); stroke: #64b392; stroke-width: 1.5; }
      .housing { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; }
      .screw { fill: #94a3b8; stroke: #64748b; stroke-width: 0.8; }
      .keycap { fill: #f8c6d8; stroke: #d98ca8; stroke-width: 2; rx: 10; }
      .keycap-held { fill: #fde68a; stroke: #d97706; stroke-width: 3; rx: 10; }
      .key-label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #1e293b; text-anchor: middle; }
      .key-sub { font: 600 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #475569; text-anchor: middle; }
      .ball-label { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #ffffff; text-anchor: middle; paint-order: stroke; stroke: #1e293b; stroke-width: 3px; stroke-linejoin: round; }
      .ball-sub { font: 600 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #e2e8f0; text-anchor: middle; paint-order: stroke; stroke: #1e293b; stroke-width: 2.5px; stroke-linejoin: round; }
      .fn-btn { fill: #1e293b; stroke: #0f172a; stroke-width: 1.5; rx: 3; }
      .fn-btn-held { fill: #f59e0b; stroke: #b45309; stroke-width: 2; rx: 3; }
      .pwr-sw { fill: #cbd5e1; stroke: #64748b; stroke-width: 1.2; rx: 2; }
      .callout-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .callout-held { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; rx: 6; }
      .callout-scroll { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .callout-text { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #1e293b; text-anchor: middle; }
      .callout-sub { font: 500 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #475569; text-anchor: middle; }
      .legend-text { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #334155; }
      .legend-bold { font: 700 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="780" fill="#f8fafc"/>

  <!-- Header -->
  <text x="36" y="42" class="title">Trackball Keymap &amp; Hardware Layout (zmk-config-test)</text>
  <text x="36" y="64" class="subtitle">nRF52840 (nice!nano v2) · PMW3610 Trackball · 3 Direct GPIO Keys (P0.29 Left, P0.31 Right, P0.10 FN) · 2 SK6812-mini-e Profile LEDs (P0.09)</text>

  <!-- ==================== LAYER 0: DEFAULT ==================== -->
  <g transform="translate(30, 82)" filter="url(#cardShadow)">
    <rect width="555" height="295" class="card"/>
    <text x="20" y="28" class="layer-title">Layer 0 — Default</text>
    <text x="535" y="28" text-anchor="end" class="layer-sub">Base mouse &amp; DPI cycle</text>

    <!-- Hardware Body -->
    <g transform="translate(97, 56)">
      <rect x="0" y="20" width="360" height="122" rx="8" class="case-body"/>
      <polygon points="0,118 360,118 360,142 0,142" class="case-bevel"/>
      <!-- Center Trackball Housing -->
      <path d="M 115,120 L 115,34 Q 115,4 180,4 Q 245,4 245,34 L 245,120 Z" class="housing"/>
      <circle cx="127" cy="108" r="4" class="screw"/>
      <circle cx="233" cy="108" r="4" class="screw"/>
      <circle cx="180" cy="60" r="48" fill="url(#ballGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <text x="180" y="57" class="ball-label">Cursor</text>
      <text x="180" y="72" class="ball-sub">Move</text>
      <!-- Left Pink Keycap -->
      <rect x="26" y="42" width="66" height="66" class="keycap"/>
      <text x="59" y="73" class="key-label">LCLK</text>
      <text x="59" y="88" class="key-sub">&amp;mkp LCLK</text>
      <!-- Right Pink Keycap -->
      <rect x="268" y="42" width="66" height="66" class="keycap"/>
      <text x="301" y="73" class="key-label">RCLK</text>
      <text x="301" y="88" class="key-sub">&amp;mkp RCLK</text>
      <!-- Front Edge FN & Power -->
      <rect x="166" y="131" width="28" height="10" class="fn-btn"/>
      <rect x="242" y="131" width="28" height="10" class="pwr-sw"/>
      <text x="256" y="156" class="callout-sub">Power</text>
    </g>
    <!-- FN Callout -->
    <line x1="277" y1="197" x2="277" y2="222" stroke="#64748b" stroke-width="1.5"/>
    <rect x="142" y="222" width="270" height="44" class="callout-box"/>
    <text x="277" y="240" class="callout-text">FN: Tap → Cycle DPI (400 / 600 / 1000)</text>
    <text x="277" y="256" class="callout-sub">Hold → Layer 1 (BT)</text>
  </g>

  <!-- ==================== LAYER 1: BT ==================== -->
  <g transform="translate(615, 82)" filter="url(#cardShadow)">
    <rect width="555" height="295" class="card"/>
    <text x="20" y="28" class="layer-title">Layer 1 — BT</text>
    <text x="535" y="28" text-anchor="end" class="layer-sub">Hold FN</text>

    <!-- Hardware Body -->
    <g transform="translate(97, 56)">
      <rect x="0" y="20" width="360" height="122" rx="8" class="case-body"/>
      <polygon points="0,118 360,118 360,142 0,142" class="case-bevel"/>
      <!-- Center Trackball Housing -->
      <path d="M 115,120 L 115,34 Q 115,4 180,4 Q 245,4 245,34 L 245,120 Z" class="housing"/>
      <circle cx="127" cy="108" r="4" class="screw"/>
      <circle cx="233" cy="108" r="4" class="screw"/>
      <circle cx="180" cy="60" r="48" fill="url(#ballGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <text x="180" y="57" class="ball-label">Cursor</text>
      <text x="180" y="72" class="ball-sub">Move</text>
      <!-- Left Pink Keycap -->
      <rect x="26" y="42" width="66" height="66" class="keycap"/>
      <text x="59" y="66" class="key-label">Tap:</text>
      <text x="59" y="80" class="key-sub">Toggle Scroll</text>
      <text x="59" y="96" class="key-sub">Hold: BT Clear</text>
      <!-- Right Pink Keycap -->
      <rect x="268" y="42" width="66" height="66" class="keycap"/>
      <text x="301" y="72" class="key-label">BT Next</text>
      <text x="301" y="87" class="key-sub">Profile 0 ↔ 1</text>
      <!-- Front Edge FN (HELD) & Power -->
      <rect x="166" y="131" width="28" height="10" class="fn-btn-held"/>
      <rect x="242" y="131" width="28" height="10" class="pwr-sw"/>
      <text x="256" y="156" class="callout-sub">Power</text>
    </g>
    <!-- FN Callout -->
    <line x1="277" y1="197" x2="277" y2="222" stroke="#d97706" stroke-width="1.8"/>
    <rect x="187" y="222" width="180" height="44" class="callout-held"/>
    <text x="277" y="241" class="callout-text">FN: HELD</text>
    <text x="277" y="257" class="callout-sub">Activates Layer 1 (BT)</text>
  </g>

  <!-- ==================== LAYER 2: BT CLEAR ==================== -->
  <g transform="translate(30, 397)" filter="url(#cardShadow)">
    <rect width="555" height="295" class="card"/>
    <text x="20" y="28" class="layer-title">Layer 2 — BT Clear</text>
    <text x="535" y="28" text-anchor="end" class="layer-sub">Hold FN + Hold Left</text>

    <!-- Hardware Body -->
    <g transform="translate(97, 56)">
      <rect x="0" y="20" width="360" height="122" rx="8" class="case-body"/>
      <polygon points="0,118 360,118 360,142 0,142" class="case-bevel"/>
      <!-- Center Trackball Housing -->
      <path d="M 115,120 L 115,34 Q 115,4 180,4 Q 245,4 245,34 L 245,120 Z" class="housing"/>
      <circle cx="127" cy="108" r="4" class="screw"/>
      <circle cx="233" cy="108" r="4" class="screw"/>
      <circle cx="180" cy="60" r="48" fill="url(#ballGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <text x="180" y="57" class="ball-label">Cursor</text>
      <text x="180" y="72" class="ball-sub">Move</text>
      <!-- Left Keycap (HELD) -->
      <rect x="26" y="42" width="66" height="66" class="keycap-held"/>
      <text x="59" y="73" class="key-label">HELD</text>
      <text x="59" y="88" class="key-sub">Layer 2</text>
      <!-- Right Pink Keycap -->
      <rect x="268" y="42" width="66" height="66" class="keycap"/>
      <text x="301" y="69" class="key-label">Clear All</text>
      <text x="301" y="83" class="key-sub">BT Bonds</text>
      <text x="301" y="96" class="key-sub">(Blink LEDs)</text>
      <!-- Front Edge FN (HELD) & Power -->
      <rect x="166" y="131" width="28" height="10" class="fn-btn-held"/>
      <rect x="242" y="131" width="28" height="10" class="pwr-sw"/>
      <text x="256" y="156" class="callout-sub">Power</text>
    </g>
    <!-- FN Callout -->
    <line x1="277" y1="197" x2="277" y2="222" stroke="#d97706" stroke-width="1.8"/>
    <rect x="187" y="222" width="180" height="44" class="callout-held"/>
    <text x="277" y="241" class="callout-text">FN: HELD</text>
    <text x="277" y="257" class="callout-sub">With Left HELD → BT Clear</text>
  </g>

  <!-- ==================== LAYER 3: SCROLL ==================== -->
  <g transform="translate(615, 397)" filter="url(#cardShadow)">
    <rect width="555" height="295" class="card"/>
    <text x="20" y="28" class="layer-title">Layer 3 — Scroll</text>
    <text x="535" y="28" text-anchor="end" class="layer-sub">Toggle via Hold FN + Tap Left</text>

    <!-- Hardware Body -->
    <g transform="translate(97, 56)">
      <rect x="0" y="20" width="360" height="122" rx="8" class="case-body"/>
      <polygon points="0,118 360,118 360,142 0,142" class="case-bevel"/>
      <!-- Center Trackball Housing -->
      <path d="M 115,120 L 115,34 Q 115,4 180,4 Q 245,4 245,34 L 245,120 Z" class="housing"/>
      <circle cx="127" cy="108" r="4" class="screw"/>
      <circle cx="233" cy="108" r="4" class="screw"/>
      <circle cx="180" cy="60" r="52" class="callout-scroll"/>
      <circle cx="180" cy="60" r="47" fill="url(#ballGrad)" stroke="#0284c7" stroke-width="2"/>
      <text x="180" y="57" class="ball-label">Scroll</text>
      <text x="180" y="72" class="ball-sub">Wheel (1/16)</text>
      <!-- Left Pink Keycap -->
      <rect x="26" y="42" width="66" height="66" class="keycap"/>
      <text x="59" y="73" class="key-label">LCLK</text>
      <text x="59" y="88" class="key-sub">(trans)</text>
      <!-- Right Pink Keycap -->
      <rect x="268" y="42" width="66" height="66" class="keycap"/>
      <text x="301" y="73" class="key-label">RCLK</text>
      <text x="301" y="88" class="key-sub">(trans)</text>
      <!-- Front Edge FN & Power -->
      <rect x="166" y="131" width="28" height="10" class="fn-btn"/>
      <rect x="242" y="131" width="28" height="10" class="pwr-sw"/>
      <text x="256" y="156" class="callout-sub">Power</text>
    </g>
    <!-- FN Callout -->
    <line x1="277" y1="197" x2="277" y2="222" stroke="#64748b" stroke-width="1.5"/>
    <rect x="132" y="222" width="290" height="44" class="callout-box"/>
    <text x="277" y="240" class="callout-text">FN + Tap Left → Exit Scroll Mode</text>
    <text x="277" y="256" class="callout-sub">FN (trans): Tap DPI / Hold BT</text>
  </g>

  <!-- ==================== FOOTER: SK6812 PROFILE LEDs ==================== -->
  <g transform="translate(30, 710)">
    <rect width="1140" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="20" y="31" class="legend-bold">SK6812 Profile LEDs (Reversed):</text>
    <text x="250" y="31" class="legend-text">Left LED = Profile 0 · Right LED = Profile 1</text>

    <circle cx="560" cy="26" r="7" fill="#22c55e"/>
    <text x="574" y="31" class="legend-text">Green slow blink = Advertising</text>

    <circle cx="785" cy="26" r="7" fill="#3b82f6"/>
    <text x="799" y="31" class="legend-text">Blue solid (5s) = Connected</text>

    <circle cx="990" cy="26" r="7" fill="#ef4444"/>
    <text x="1004" y="31" class="legend-text">Red fast blink = Disc. / Clear</text>
  </g>
</svg>
