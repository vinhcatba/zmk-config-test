# SPDX-License-Identifier: MIT

description: Cycle a fixed DPI list on keypress and apply custom DPI (200..3200, step 200) immediately on ZMK Studio Save.

compatible: "zmk,behavior-sensor-attr-set"

include: one_param.yaml

properties:
  sensor_device:
    required: true
    type: phandle
    description: The target sensor device to send sensor_attr_set commands to.
  values:
    required: true
    type: array
    description: Fixed list of DPI values cycled through on physical keypress.
  attr:
    required: true
    type: int
    description: The sensor attribute identifier to modify.
  persistant:
    type: boolean
    description: Persist active DPI and cycle index to flash and restore on boot.
  save_delay:
    default: 2000
    type: int
    description: Delay in ms before writing persisted state to flash.
  load_delay:
    default: 1500
    type: int
    description: Delay in ms after boot before applying restored DPI to the sensor.
